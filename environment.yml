# =====================================================================
#  Entorno "mia203" con GPU NVIDIA (CUDA 12.8; requerido por GPUs Blackwell)
#  conda env create -f environment.yml && conda activate mia203
# =====================================================================
name: mia203
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - pyarrow
  - scikit-learn
  - matplotlib
  - pyyaml
  - tqdm
  - jupyterlab
  - ipykernel
  # --- Pregunta 2 ---
  - rasterio
  - geopandas
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch>=2.7
      - torchvision>=0.22
      # --- Pregunta 1: DICOM y decodificadores JPEG / JPEG 2000 ---
      - pydicom>=3.0
      - pylibjpeg>=2.0
      - pylibjpeg-libjpeg
      - pylibjpeg-openjpeg
      - opencv-python-headless
      - langdetect
      # --- Pregunta 3 ---
      - ultralytics>=8.3
