# =====================================================================
#  Pregunta 1: clasificación multietiqueta de anomalías de rodilla en RM
#  {data_root} y {runs_root} se resuelven con configs/paths.local.yaml;
#  {repo_root} es la raíz del repositorio.
# =====================================================================

seed: 42

# ---------------------------------------------------------------------
# 1. Directorios
# ---------------------------------------------------------------------
data:
  raw_dir: "{data_root}/p1_rsna_knee/raw"            # datos originales
  interim_dir: "{data_root}/p1_rsna_knee/interim"    # tablas intermedias
  processed_dir: "{data_root}/p1_rsna_knee/processed" # volúmenes .npy
  runs_dir: "{runs_root}/p1"                          # pesos y resultados por experimento
  reports_dir: "{repo_root}/p1_rodilla/reports"       # tablas y figuras versionadas

# ---------------------------------------------------------------------
# 2. Esquema del conjunto RSNA Knee Abnormality Detection
#    train.csv: 4,407 estudios con reporte; 58 con las 12 etiquetas doradas (0/1).
#    train_series.csv: 24,371 series con plano, supresión grasa y sensibilidad a líquido.
#    Imágenes: train_series/<StudyInstanceUID>/<SeriesInstanceUID>/<SOPInstanceUID>.dcm
# ---------------------------------------------------------------------
schema:
  studies_csv: "train.csv"        # un estudio por fila
  study_col: "StudyInstanceUID"
  # Columnas de etiqueta, en el mismo orden que labels.names (vacías fuera del conjunto dorado)
  label_cols:
    - "ACL"
    - "MCL"
    - "Medial Meniscus"
    - "Lateral Meniscus"
    - "Medial OA"
    - "Lateral OA"
    - "PF OA"
    - "Effusion"
    - "Synovitis"
    - "Baker's"
    - "Contusion"
    - "Fracture"
  # Umbral de binarización de las etiquetas doradas
  gold_positive_threshold: 0.5
  # Reportes: columna 'col' de 'csv' (source: csv) o un archivo por estudio (source: folder)
  reports:
    source: "csv"
    csv: "train.csv"
    col: "Report"
    glob: "reports/{study_id}.txt"
  # Tabla oficial de series (anotación de plano y secuencia; prevalece sobre la cabecera DICOM)
  series_csv: "train_series.csv"
  series_col: "SeriesInstanceUID"
  series_plane_col: "Anatomical_Plane"     # Sagittal | Coronal | Axial
  series_fat_sat_col: "Fat_Suppression"    # 1 = supresión grasa
  series_fluid_col: "Fluid_Sensitive"      # 1 = sensible a líquido (PD/T2/STIR)
  # Imágenes: <raw_dir>/<images_subdir>/<study_id>/<series_id>/*.dcm
  images_subdir: "train_series"
  dicom_ext: ".dcm"

# ---------------------------------------------------------------------
# 3. Etiquetas
# ---------------------------------------------------------------------
labels:
  names:
    - acl               # lesión del ligamento cruzado anterior
    - mcl               # lesión del ligamento colateral medial
    - medial_meniscus   # daño del menisco medial
    - lateral_meniscus  # daño del menisco lateral
    - medial_oa         # osteoartrosis del compartimento medial
    - lateral_oa        # osteoartrosis del compartimento lateral
    - pf_oa             # osteoartrosis patelofemoral
    - effusion          # derrame articular
    - synovitis         # sinovitis
    - baker_cyst        # quiste de Baker
    - bone_contusion    # contusión ósea
    - fracture          # fractura
  # Fuente de etiquetas débiles: rules | llm | combined
  source: "rules"
  # Hallazgo no mencionado: negative (objetivo 0, peso weight_unmentioned) | ignore (peso 0)
  unmentioned_policy: "negative"
  weight_positive: 1.0
  weight_negative: 1.0
  weight_uncertain: 0.0
  weight_unmentioned: 0.5
  uncertain_as: 1            # objetivo de los inciertos si weight_uncertain > 0
  # Fracción de estudios dorados para el análisis de errores de las reglas (desarrollo);
  # el resto (reserva) solo se usa para medir el acuerdo.
  gold_dev_fraction: 0.5

# ---------------------------------------------------------------------
# 4. Etiquetado con modelo de lenguaje local (etapa 4, opcional)
# ---------------------------------------------------------------------
llm:
  host: "http://localhost:11434"   # servidor Ollama local
  model: "qwen2.5:14b-instruct"
  temperature: 0.0
  timeout_s: 120
  only_subset: true                # solo estudios seleccionados y dorados

# ---------------------------------------------------------------------
# 5. Selección de series y estudios
# ---------------------------------------------------------------------
selection:
  # Preferencia de serie por estudio (se aplica la primera regla con candidatos; null = sin filtro)
  series_priority:
    - {plane: "sagittal", fat_sat: true, fluid_sensitive: true}    # sagital DP/T2 con supresión grasa
    - {plane: "sagittal", fat_sat: null, fluid_sensitive: true}    # sagital DP/T2
    - {plane: "sagittal", fat_sat: null, fluid_sensitive: null}    # cualquier sagital
    - {plane: "coronal", fat_sat: true, fluid_sensitive: true}     # coronal DP/T2 con supresión grasa
  min_slices: 12
  n_studies: 500          # tamaño del subconjunto no dorado
  min_pos_per_label: 15   # positivos mínimos por hallazgo en el subconjunto
  val_fraction: 0.15      # fracción del subconjunto para validación
  use_gold_as: "test"     # estudios dorados: solo evaluación

# ---------------------------------------------------------------------
# 6. Preprocesamiento de volúmenes
# ---------------------------------------------------------------------
preprocess:
  n_slices: 24            # cortes por volumen (remuestreo uniforme)
  size: 256               # lado tras recorte cuadrado y redimensión
  p_low: 1.0              # percentiles de la ventana de intensidad
  p_high: 99.5
  num_workers: 16         # procesos en paralelo

# ---------------------------------------------------------------------
# 7. Modelo
# ---------------------------------------------------------------------
model:
  # scratch (codificador propio) | resnet18 | resnet34 | resnet50 | efficientnet_b0 (ImageNet)
  backbone: "resnet50"
  pretrained: true
  scratch_channels: [32, 64, 128, 256]
  pooling: "attention"    # agregación de cortes: attention | max | mean
  dropout: 0.3
  slices_in: 16           # cortes de entrada por estudio

# ---------------------------------------------------------------------
# 8. Entrenamiento
# ---------------------------------------------------------------------
train:
  epochs: 25
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 1
  loss: "bce"             # bce | focal
  focal_gamma: 2.0
  pos_weight: "auto"      # auto (negativos/positivos, acotado) | none
  pos_weight_max: 10.0
  sampler: "none"         # none | oversample_rare
  amp: true               # bf16 en CUDA
  grad_clip: 1.0
  num_workers: 8
  early_stopping_patience: 6
  device: "auto"

# ---------------------------------------------------------------------
# 9. Evaluación e interpretabilidad
# ---------------------------------------------------------------------
eval:
  threshold_strategy: "max_f1_val"   # umbral por hallazgo: máximo F1 en validación
  bootstrap: 1000
gradcam:
  findings: ["acl", "medial_meniscus", "effusion", "bone_contusion"]
  n_cases: 3

# ---------------------------------------------------------------------
# 10. Ablación: nombre del experimento y overrides respecto del config base
# ---------------------------------------------------------------------
ablation:
  experiments:
    - name: "A_scratch_bce"
      set: ["model.backbone=scratch", "model.pretrained=false", "train.lr=1.0e-3"]
    - name: "B_resnet50_bce"
      set: ["model.backbone=resnet50"]
    - name: "C_resnet50_focal"
      set: ["model.backbone=resnet50", "train.loss=focal"]
    - name: "D_resnet18_bce"
      set: ["model.backbone=resnet18"]
    - name: "E_resnet50_ignorar_no_mencionados"
      set: ["model.backbone=resnet50", "labels.unmentioned_policy=ignore"]
    - name: "F_resnet50_sobremuestreo"
      set: ["model.backbone=resnet50", "train.sampler=oversample_rare"]
